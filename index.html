<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Weekly Almanac — Market Prediction Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#12100D; --ink-800:#1D1914; --ink-700:#282219;
    --brass:#C7A153; --brass-dim:#8A7240;
    --bull:#5B9E72; --bull-dim:rgba(91,158,114,.14);
    --bear:#BD5A42; --bear-dim:rgba(189,90,66,.14);
    --neutral:#8B8578;
    --paper:#EDE6D3; --paper-dim:#A9A290;
    --rule:#3A332A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ink-900); color:var(--paper);
    font-family:'Inter',sans-serif; line-height:1.6;
    background-image: radial-gradient(circle at 15% 0%, rgba(199,161,83,0.06), transparent 45%);
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 22px 80px;}

  nav{display:flex; gap:22px; padding:14px 0 22px; border-bottom:1px solid var(--rule); margin-bottom:26px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:1.5px; text-transform:uppercase;}
  nav a{color:var(--paper-dim); text-decoration:none; transition:color .15s;}
  nav a:hover, nav a.active{color:var(--brass);}
  nav .navbrand{color:var(--brass); font-weight:700; margin-right:auto;}

  .masthead{border:1px solid var(--rule); border-radius:2px; padding:26px 28px; position:relative; overflow:hidden;}
  .masthead::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg, var(--brass-dim) 0 1px, transparent 1px 44px); opacity:.15;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--brass); display:flex; justify-content:space-between; margin-bottom:14px;}
  h1{font-family:'Fraunces',serif; font-weight:600; font-size:38px; margin:0 0 6px; letter-spacing:.2px;}
  .subline{color:var(--paper-dim); font-size:14px; margin-bottom:20px;}
  .call-row{display:flex; gap:28px; flex-wrap:wrap; align-items:baseline; border-top:1px solid var(--rule); padding-top:18px;}
  .call-item .k{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--paper-dim); text-transform:uppercase;}
  .call-item .v{font-family:'Fraunces',serif; font-size:20px; font-weight:600;}
  .v.up{color:var(--bull);} .v.down{color:var(--bear);} .v.flat,.v.neutral{color:var(--neutral);}

  .scorecards{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:20px;}
  .card{background:var(--ink-800); border:1px solid var(--rule); border-radius:2px; padding:18px;}
  .card .ticker{font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:2px; color:var(--brass); margin-bottom:6px;}
  .card .dir{font-family:'Fraunces',serif; font-size:24px; font-weight:600;}
  .card .range{font-family:'IBM Plex Mono',monospace; font-size:13px; margin-top:2px; color:var(--paper-dim);}
  .card .tech{margin-top:12px; padding-top:10px; border-top:1px solid var(--rule); font-size:12px; color:var(--paper-dim);}
  .card .tech b{color:var(--paper);}

  .section-label{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--brass); margin:34px 0 12px; display:flex; align-items:center; gap:10px;}
  .section-label::after{content:""; flex:1; height:1px; background:var(--rule);}

  .agent-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .agent-card{background:var(--ink-800); border:1px solid var(--rule); border-radius:2px; padding:16px;}
  .agent-card h4{margin:0 0 8px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--brass); text-transform:uppercase;}
  .agent-card .row{font-size:12px; color:var(--paper-dim); margin:4px 0;}
  .agent-card .row b{color:var(--paper);}

  .llm-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:14px;}
  .llm-card{background:var(--ink-800); border:1px solid var(--rule); border-radius:2px; padding:14px;}
  .llm-card .name{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--brass); font-weight:700;}
  .llm-card .call{font-family:'Fraunces',serif; font-size:16px; margin:6px 0;}
  .llm-card .reasoning{font-size:12px; color:var(--paper-dim); margin-top:6px; font-style:italic;}
  .llm-card .weight{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--paper-dim); margin-top:8px;}

  select{background:var(--ink-800); color:var(--paper); border:1px solid var(--rule); padding:6px 10px; font-family:'IBM Plex Mono',monospace; font-size:12px; border-radius:2px;}
  footer{margin-top:40px; padding-top:16px; border-top:1px solid var(--rule); font-size:12px; color:var(--paper-dim); font-family:'IBM Plex Mono',monospace;}
  footer a{color:var(--brass);}
  .err{color:var(--bear); padding:20px; border:1px solid var(--bear); border-radius:2px;}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <span class="navbrand">TEAM ULTRA</span>
    <a href="index.html" class="active">Dashboard</a>
    <a href="agents.html">Agents</a>
    <a href="calibration.html">Calibration</a>
    <a href="correlations.html">Correlations</a>
    <a href="logs.html">Logs</a>
  </nav>
  <div id="app">Loading…</div>
</div>

<script>
const TICKERS = { GSPC: "S&P 500", NDX: "Nasdaq 100", IWM: "Russell 2000" };

function fmtPct(v){ if (v===null||v===undefined||Number.isNaN(v)) return "—"; const n=Number(v); return (n>0?"+":"") + n.toFixed(2) + "%"; }
function dirClass(d){ d=(d||"").toLowerCase(); if(d.includes("up")) return "up"; if(d.includes("down")) return "down"; return "flat"; }

async function build() {
  const app = document.getElementById("app");
  try {
    const manifest = await fetch("data/manifest.json").then(r => r.json());
    const dates = [...new Set(manifest.predictions.map(f => f.match(/prediction_([\d-]+)_/)[1]))].sort();
    const latestDate = dates[dates.length - 1];

    const preds = {};
    for (const t of Object.keys(TICKERS)) {
      const fname = `prediction_${latestDate}_${t}.json`;
      if (manifest.predictions.includes(fname)) {
        preds[t] = await fetch(`data/predictions/${fname}`).then(r => r.json());
      }
    }

    const ndx = preds.NDX || Object.values(preds)[0];
    const macro = ndx?.macro || {};

    const cardHtml = (t) => {
      const p = preds[t];
      if (!p) return "";
      return `<div class="card">
        <div class="ticker">${t} · ${TICKERS[t]}</div>
        <div class="dir ${dirClass(p.weighted_direction)}">${(p.weighted_direction||'—').toUpperCase()}</div>
        <div class="range">${fmtPct(p.weighted_range_low)} to ${fmtPct(p.weighted_range_high)} · ${p.weighted_confidence||'—'} conf</div>
        <div class="tech">
          <b>Technical:</b> ${p.technical?.trend||'—'} (RSI ${p.technical?.rsi ?? '—'})<br>
          <b>Almanac:</b> ${p.almanac?.seasonal_bias||'—'} (${((p.almanac?.win_rate_this_month||0)*100).toFixed(0)}% win rate, ${p.almanac?.years_of_history||'—'}y history)
        </div>
      </div>`;
    };

    app.innerHTML = `
      <div class="masthead">
        <div class="eyebrow"><span>The Weekly Almanac</span><span>Team Ultra · Own Data Feed</span></div>
        <h1>Week of ${latestDate}</h1>
        <div class="subline">Macro regime: <b>${macro.regime||'—'}</b> · ${macro.notes||''}</div>
        <div class="call-row">
          <div class="call-item"><div class="k">DXY 1w</div><div class="v">${fmtPct(macro.dxy_change_1w)}</div></div>
          <div class="call-item"><div class="k">10Y Yield 1w</div><div class="v">${fmtPct(macro.yield_10y_change_1w)}</div></div>
          <div class="call-item"><div class="k">VIX</div><div class="v">${macro.vix_level ?? '—'}</div></div>
        </div>
      </div>

      <div class="scorecards">
        ${cardHtml("GSPC")}${cardHtml("NDX")}${cardHtml("IWM")}
      </div>

      <div class="section-label">This Week's Calls, In Full</div>
      <p style="font-size:13px; color:var(--paper-dim)">Full agent breakdown (Technical / Macro / Almanac) and every LLM's individual call with reasoning →
        <a href="agents.html" style="color:var(--brass)">Agents page</a>. Historical hit-rate and trust weights →
        <a href="calibration.html" style="color:var(--brass)">Calibration page</a>.</p>

      <footer>Source: <a href="https://github.com/ProfDrTan/market-prediction-engine" target="_blank">github.com/ProfDrTan/market-prediction-engine</a> · refreshes on page load · own data, not mirrored from any student team</footer>
    `;
  } catch (e) {
    app.innerHTML = `<div class="err">Could not load live data: ${e.message}</div>`;
  }
}
build();
</script>
</body>
</html>

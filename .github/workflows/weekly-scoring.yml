name: Weekly Calibration Scoring

# Compares prior predictions against actual market outcomes (via yfinance),
# updates each model's trust weight, and commits the calibration + trust
# data back to the repo. This is the automated replacement for Team 1's
# manual "R10 QA and Learning Log Lead" role.

on:
  schedule:
    # Monday 05:00 UTC — runs before weekly-pipeline.yml (06:00 UTC) so that
    # the previous week's predictions are scored before the next week's
    # trust-weighted synthesis runs.
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  score-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Score predictions against actuals
        run: python calibration/score_predictions.py

      - name: Commit and push calibration results
        run: |
          git config user.name "market-prediction-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/calibration/ data/trust/ || true
          if git diff --cached --quiet; then
            echo "No new calibration data to commit."
          else
            git commit -m "Weekly calibration scoring: $(date -u +'%Y-%m-%d')"
            git push
          fi

name: Weekly Prediction Pipeline

# Runs the full agent + multi-LLM synthesis pipeline for SPX/NDX/IWM
# and commits the resulting prediction JSON files back to the repo.

on:
  schedule:
    # Monday 06:00 UTC — before US market open, once weekly.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run prediction pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          mkdir -p data/logs
          LOGFILE="data/logs/pipeline_$(date -u +%Y%m%d_%H%M%S).txt"
          python run_pipeline.py > "$LOGFILE" 2>&1
          EXIT_CODE=$?
          echo "" >> "$LOGFILE"
          echo "PYTHON EXIT CODE: $EXIT_CODE" >> "$LOGFILE"
          echo "----- log contents -----"
          cat "$LOGFILE"
          echo "-------------------------"
          echo "----- data/ tree after run -----"
          find data -type f
          echo "---------------------------------"
          exit 0

      - name: Regenerate data manifest for the front end
        run: |
          python3 - << 'PYEOF'
          import json, os
          def listing(d):
              return sorted(f for f in os.listdir(d)) if os.path.isdir(d) else []
          manifest = {
              "generated": __import__("datetime").datetime.utcnow().isoformat() + "Z",
              "predictions": listing("data/predictions"),
              "calibration": listing("data/calibration"),
              "logs": listing("data/logs"),
              "tickers": ["GSPC", "NDX", "IWM"],
          }
          with open("data/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print("Manifest written:", manifest["generated"])
          PYEOF

      - name: Commit and push new predictions and logs
        run: |
          set +e
          git config user.name "market-prediction-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          git status
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Weekly pipeline run: $(date -u +'%Y-%m-%d')"
            git push
          fi
          exit 0

      - name: Fail the run if no predictions were actually produced
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(ls data/predictions/prediction_${TODAY}_*.json 2>/dev/null | wc -l)
          echo "Predictions written today: $COUNT"
          if [ "$COUNT" -lt 3 ]; then
            echo "::error::Expected 3 prediction files (GSPC, NDX, IWM) for $TODAY, found $COUNT. Check the log artifact committed above."
            exit 1
          fi

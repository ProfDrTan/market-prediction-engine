<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cross-Asset Correlations — Market Prediction Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#12100D; --ink-800:#1D1914; --ink-700:#282219;
    --brass:#C7A153; --brass-dim:#8A7240;
    --bull:#5B9E72; --bull-dim:rgba(91,158,114,.14);
    --bear:#BD5A42; --bear-dim:rgba(189,90,66,.14);
    --neutral:#8B8578;
    --paper:#EDE6D3; --paper-dim:#A9A290;
    --rule:#3A332A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ink-900); color:var(--paper);
    font-family:'Inter',sans-serif; line-height:1.6;
    background-image: radial-gradient(circle at 15% 0%, rgba(199,161,83,0.06), transparent 45%);
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 22px 80px;}

  nav{display:flex; gap:22px; padding:14px 0 22px; border-bottom:1px solid var(--rule); margin-bottom:26px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:1.5px; text-transform:uppercase;}
  nav a{color:var(--paper-dim); text-decoration:none; transition:color .15s;}
  nav a:hover, nav a.active{color:var(--brass);}
  nav .navbrand{color:var(--brass); font-weight:700; margin-right:auto;}

  .masthead{border:1px solid var(--rule); border-radius:2px; padding:26px 28px; position:relative; overflow:hidden; margin-bottom:30px;}
  .masthead::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg, var(--brass-dim) 0 1px, transparent 1px 44px); opacity:.15;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--brass); display:flex; justify-content:space-between; margin-bottom:14px;}
  h1{font-family:'Fraunces',serif; font-weight:600; font-size:34px; margin:0 0 6px; letter-spacing:.2px;}
  .subline{color:var(--paper-dim); font-size:14px;}

  .day-card{background:var(--ink-800); border:1px solid var(--rule); border-radius:2px; padding:22px 24px; margin-bottom:22px;}
  .day-head{display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--rule); padding-bottom:12px; margin-bottom:16px;}
  .day-date{font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--paper);}
  .day-label{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--brass);}

  .metric-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px;}
  @media(max-width:640px){.metric-grid{grid-template-columns:1fr;}}
  .metric{background:var(--ink-900); border:1px solid var(--rule); border-radius:2px; padding:12px 14px;}
  .metric .label{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--brass); margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;}
  .metric .text{font-size:13px; color:var(--paper); line-height:1.55;}
  .conf{font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; padding:2px 7px; border-radius:10px;}
  .conf-high{color:var(--bull); background:var(--bull-dim);}
  .conf-medium{color:var(--brass); background:rgba(199,161,83,.14);}
  .conf-none{color:var(--bear); background:var(--bear-dim);}

  .causal{background:var(--ink-900); border-left:3px solid var(--brass); border-radius:2px; padding:14px 16px; margin-top:4px;}
  .causal .label{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--brass); margin-bottom:8px;}
  .causal .text{font-size:13.5px; color:var(--paper); line-height:1.65;}
  .overall{margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--paper-dim);}

  .section-label{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--brass); margin:34px 0 12px; display:flex; align-items:center; gap:10px;}
  .section-label::after{content:""; flex:1; height:1px; background:var(--rule);}
  .note-box{font-size:13px; color:var(--paper-dim); background:var(--ink-800); border:1px solid var(--rule); border-radius:2px; padding:16px 18px;}

  footer{margin-top:40px; padding-top:16px; border-top:1px solid var(--rule); font-size:12px; color:var(--paper-dim); font-family:'IBM Plex Mono',monospace;}
  footer a{color:var(--brass);}
  .err{color:var(--bear); padding:20px; border:1px solid var(--bear); border-radius:2px;}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <span class="navbrand">TEAM ULTRA</span>
    <a href="index.html">Dashboard</a>
    <a href="agents.html">Agents</a>
    <a href="calibration.html">Calibration</a>
    <a href="correlations.html" class="active">Correlations</a>
    <a href="logs.html">Logs</a>
  </nav>
  <div id="app">Loading…</div>
</div>

<script>
function confBadge(c){
  const cls = c === "high" ? "conf-high" : (c === "medium" ? "conf-medium" : "conf-none");
  return `<span class="conf ${cls}">${(c||"none").toUpperCase()}</span>`;
}

function metricBlock(title, m){
  if(!m) return "";
  return `<div class="metric">
    <div class="label"><span>${title}</span>${confBadge(m.confidence)}</div>
    <div class="text">${m.note}</div>
  </div>`;
}

async function build(){
  const app = document.getElementById("app");
  try{
    const data = await fetch("data/correlations.json").then(r => r.json());
    const entries = [...data.entries].sort((a,b) => b.date.localeCompare(a.date));

    const cardsHtml = entries.map(e => `
      <div class="day-card">
        <div class="day-head">
          <div class="day-date">${e.date}</div>
          <div class="day-label">${e.day_label || ""}</div>
        </div>
        <div class="metric-grid">
          ${metricBlock("Treasury Yields", e.yields)}
          ${metricBlock("Gold", e.gold)}
          ${metricBlock("Bitcoin", e.bitcoin)}
          ${metricBlock("Dollar (DXY)", e.dollar)}
          ${metricBlock("Oil / Geopolitical", e.oil_geopolitical)}
          ${e.equities ? metricBlock("Equities", e.equities) : ""}
        </div>
        <div class="causal">
          <div class="label">Causal Read</div>
          <div class="text">${e.causal_read}</div>
          <div class="overall">Overall confidence: ${e.confidence_overall || "—"}</div>
        </div>
      </div>
    `).join("");

    app.innerHTML = `
      <div class="masthead">
        <div class="eyebrow"><span>Cross-Asset Correlations</span><span>Team Ultra · Daily Log</span></div>
        <h1>Yields · Gold · Bitcoin · Dollar · Oil/Geopolitical</h1>
        <div class="subline">${data.meta?.purpose || ""}</div>
      </div>

      ${cardsHtml}

      <div class="section-label">Reading This Page</div>
      <div class="note-box">
        Each day logs what moved and by how much, then a plain-language causal read — including when the obvious single-variable story (e.g. "yields up → gold down") doesn't actually hold up against the full-day data. Confidence tags are shown per metric: a metric tagged <span class="conf conf-none" style="margin:0 2px;">NONE</span> means the same-day figure could not be independently confirmed from public sources — that gap is left visible rather than filled with a guess. Updated ${data.meta?.last_updated || "—"} · ${data.meta?.workflow || ""}
      </div>

      <footer>Source: <a href="https://github.com/ProfDrTan/market-prediction-engine" target="_blank">github.com/ProfDrTan/market-prediction-engine</a> · refreshes on page load</footer>
    `;
  }catch(e){
    app.innerHTML = `<div class="err">Could not load correlation data: ${e.message}</div>`;
  }
}
build();
</script>
</body>
</html>
